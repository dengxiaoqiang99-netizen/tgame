<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TGame 双人诗词对战 V2.0</title>
<style>
body{

background:#111;
color:white;
font-family:"Microsoft YaHei";

}

background:#222;

h1{
color:#ffd700;

}
button{

font-size:16px;
background:#d9b437;

}
button:disabled{
background:#666;
color:#aaa;

}

margin:8px;
border-radius:10px;

font-size:16px;

}
.hidden{
display:none;
}
.info{
display:flex;
justify-content:space-around;
font-size:18px;

}

min-height:60px;

}

</head>
<body>
<div class="container">
<h1>🎮 TGame</h1>
<p>双人诗词对战 V2.0</p>
<div id="login">
<input id="roomInput" placeholder="输入6位房间号">
<button id="createBtn">创建房间</button>
<button id="joinBtn">加入房间</button>
</div>
<div id="game" class="hidden">
<h3 id="roomShow"></h3>
<div class="info">
<div>玩家1<br><span id="score1">0</span></div>
<div>玩家2<br><span id="score2">0</span></div>
</div>
<h3 id="player"></h3>
<h2 id="question">等待对局开始...</h2>
<div id="options"></div>
<div id="status"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyAol_a1CtPS-j8q7ugcDNBm13YeIuQd8ps",
authDomain:"tgema-9e482.firebaseapp.com",
projectId:"tgema-9e482",
storageBucket:"tgema-9e482.firebasestorage.app",
messagingSenderId:"160811004171",
appId:"1:160811004171:web:c36ceca017bf59e2d1b20e",
measurementId:"G-NWVCZRK6VF"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let roomID="";
let playerID="";
let gameListener=null;
let gameQuestions=[];

// 题库
const poems=[
{q:"床前明月光，下一句？",a:["疑是地上霜","举头望明月","低头思故乡","明月几时有"],c:"疑是地上霜"},
{q:"白日依山尽，下一句？",a:["黄河入海流","欲穷千里目","更上一层楼","孤帆远影碧空尽"],c:"黄河入海流"},
{q:"海内存知己，下一句？",a:["天涯若比邻","相逢何必曾相识","君问归期未有期","明月照大江"],c:"天涯若比邻"},
{q:"春眠不觉晓，下一句？",a:["处处闻啼鸟","夜来风雨声","花落知多少","月落乌啼霜满天"],c:"处处闻啼鸟"},
{q:"举头望明月，下一句？",a:["低头思故乡","疑是地上霜","明月几时有","月是故乡明"],c:"低头思故乡"},
{q:"独在异乡为异客，下一句？",a:["每逢佳节倍思亲","遍插茱萸少一人","遥知兄弟登高处","故人西辞黄鹤楼"],c:"每逢佳节倍思亲"},
{q:"黄河远上白云间，下一句？",a:["一片孤城万仞山","黄河入海流","长河落日圆","大漠孤烟直"],c:"一片孤城万仞山"},
{q:"桃李不言，下自成蹊，出自？",a:["史记","诗经","论语","楚辞"],c:"史记"},
{q:"会当凌绝顶，下一句？",a:["一览众山小","一片孤城万仞山","欲穷千里目","不尽长江滚滚来"],c:"一览众山小"},
{q:"欲穷千里目，下一句？",a:["更上一层楼","黄河入海流","孤帆远影碧空尽","千山鸟飞绝"],c:"更上一层楼"}
];

// 生成20题不重复题库
function createGameQuestions(){
    const list=[];
    let pool=[...poems];
    while(list.length<20){
        if(pool.length===0) pool=[...poems];
        const idx=Math.floor(Math.random()*pool.length);
        list.push(pool[idx]);
        pool.splice(idx,1);
    }
    return list;
}

// 创建房间
async function createRoom(){
    let input=document.getElementById("roomInput").value.trim();
    if(input) roomID=input;
    else roomID=Math.floor(100000+Math.random()*900000).toString();

    const check=await get(ref(db,"rooms/"+roomID));
    if(check.exists()){
        alert("房间已存在，请更换房间号");
        return;
    }
    playerID="player1";
    gameQuestions=createGameQuestions();
    await set(ref(db,"rooms/"+roomID),{
        player1:{score:0},
        player2:null,
        state:"waiting",
        turn:1,
        index:0,
        finished:false,
        time:Date.now()
    });
    enterRoom();
    listenRoom();
}

// 创建房间
async function createRoom(){
    let input=document.getElementById("roomInput").value.trim();
    if(input) roomID=input;
    else roomID=Math.floor(100000+Math.random()*900000).toString();

    const check=await get(ref(db,"rooms/"+roomID));
    if(check.exists()){
        alert("房间已存在，请更换房间号");
        return;
    }
    playerID="player1";
    gameQuestions=createGameQuestions();
    await set(ref(db,"rooms/"+roomID),{
        player1:{score:0},
        player2:null,
        state:"waiting",
        turn:1,
        index:0,
        finished:false,
        time:Date.now()
    });
    enterRoom();
    listenRoom();
}

// 【修复版】加入房间
async function joinRoom(){
    roomID=document.getElementById("roomInput").value.trim();
    if(!roomID){
        alert("请填写6位房间号");
        return;
    }
    const snap=await get(ref(db,"rooms/"+roomID));
    if(!snap.exists()){
        alert("房间不存在");
        return;
    }
    const data=snap.val();
    if(data.player2){
        alert("房间已满");
        return;
    }
    playerID="player2";
    // 关键修复：不要本地重新生成题库！题库以房主为准
    // gameQuestions=createGameQuestions(); 删掉这一行！
    await update(ref(db,"rooms/"+roomID),{
        player2:{score:0},
        state:"playing"
    });
    enterRoom();
    listenRoom();
}


// 切换游戏界面
function enterRoom(){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    document.getElementById("roomShow").innerText="房间号："+roomID;
    document.getElementById("player").innerText="当前身份："+playerID;
}

// 监听房间数据
function listenRoom(){
    if(gameListener) return;
    gameListener=onValue(ref(db,"rooms/"+roomID),(snapshot)=>{
        const data=snapshot.val();
        if(!data) return;
        document.getElementById("score1").innerText=data.player1?.score||0;
        document.getElementById("score2").innerText=data.player2?.score||0;
        updateStatus(data);
        showQuestion(data);
    });
}

// 更新回合状态文字
function updateStatus(data){
    const statusDom=document.getElementById("status");
    if(!data.player2){
        statusDom.innerText="⏳ 等待玩家2加入...";
    }else if(data.finished){
        statusDom.innerText="✅ 对局结束";
    }else if(data.turn===1){
        statusDom.innerText="🎯 轮到玩家1答题";
    }else{
        statusDom.innerText="🎯 轮到玩家2答题";
    }
}

// 渲染题目
function showQuestion(data){
    if(data.finished){
        showResult(data);
        return;
    }
    const idx=data.index||0;
    const q=gameQuestions[idx];
    if(!q) return;

    document.getElementById("question").innerText=q.q;
    const box=document.getElementById("options");
    box.innerHTML="";

    // 判断是否允许答题
    const canAnswer = (data.turn===1 && playerID==="player1") || (data.turn===2 && playerID==="player2");
    const options=[...q.a].sort(()=>Math.random()-0.5);

    options.forEach(text=>{
        const btn=document.createElement("button");
        btn.innerText=text;
        btn.disabled=!canAnswer;
        if(canAnswer){
            btn.onclick=()=>answer(text,data);
        }
        box.appendChild(btn);
    });
}

// 提交答案
async function answer(choice,data){
    const q=gameQuestions[data.index];
    const correct = choice===q.c;
    let s1=data.player1.score;
    let s2=data.player2.score;

    if(playerID==="player1"){
        if(correct) s1+=10;
        await update(ref(db,"rooms/"+roomID),{
            "player1/score":s1,
            turn:2
        });
    }else{
        if(correct) s2+=10;
        const nextIndex=(data.index||0)+1;
        if(nextIndex>=20){
            await update(ref(db,"rooms/"+roomID),{
                "player2/score":s2,
                finished:true
            });
        }else{
            await update(ref(db,"rooms/"+roomID),{
                "player2/score":s2,
                turn:1,
                index:nextIndex
            });
        }
    }
}

// 展示结算界面
function showResult(data){
    document.getElementById("question").innerText="🎉 对局结束";
    document.getElementById("options").innerHTML=`
        <h3>玩家1：${data.player1.score} 分</h3>
        <h3>玩家2：${data.player2.score} 分</h3>
        <button id="restartBtn">再来一局</button>
    `;
    document.getElementById("restartBtn").onclick=restartGame;
}

// 重新开局
async function restartGame(){
    gameQuestions=createGameQuestions();
    await update(ref(db,"rooms/"+roomID),{
        player1:{score:0},
        player2:{score:0},
        finished:false,
        turn:1,
        index:0
    });
}

// 页面卸载清理（优化：不强制删房间，避免另一方直接断线）
window.addEventListener("beforeunload",()=>{
    // 可选：如需退出销毁房间再开启，多人联机不建议直接删除
    /*
    if(roomID){
        remove(ref(db,"rooms/"+roomID));
    }
    */
});

// 绑定按钮
document.getElementById("createBtn").onclick=createRoom;
document.getElementById("joinBtn").onclick=joinRoom;
</script>
</body>
</html>
