<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>TGame 双人诗词小游戏</title>


<style>

body{

margin:0;

background:#111;

color:white;

font-family:
"Microsoft YaHei";

text-align:center;

}


.container{

width:90%;

max-width:420px;

margin:40px auto;

background:#222;

border-radius:20px;

padding:20px;

}


h1{

color:#ffd700;

}


button{

width:90%;

padding:14px;

margin:8px;

border:0;

border-radius:12px;

background:#d9b437;

font-size:16px;

}


input{

width:80%;

padding:12px;

border-radius:10px;

border:0;

text-align:center;

}


.hidden{

display:none;

}


.info{

display:flex;

justify-content:space-around;

}


.score{

font-size:25px;

color:#ffd700;

}


.option{

background:#d9b437;

}


#question{

margin:25px 0;

line-height:1.6;

}


</style>


</head>


<body>


<div class="container">


<h1>
🎮 TGame
</h1>


<p>
双人诗词问答
</p>



<div id="login">


<button onclick="createRoom()">

创建房间

</button>


<input id="roomInput"
placeholder="输入房间号">


<button onclick="joinRoom()">

加入房间

</button>


</div>




<div id="game"
class="hidden">



<div class="info">


<div>

玩家1

<br>

<span id="score1"
class="score">

0

</span>

</div>



<div>

玩家2

<br>

<span id="score2"
class="score">

0

</span>

</div>



</div>



<h3 id="player">

</h3>



<h3 id="status">

</h3>


<h2 id="question">

</h2>



<div id="options">

</div>



<p id="roomShow">

</p>


</div>


</div>

<script type="module">


// =============================
// Firebase SDK
// =============================


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

set,

get,

update,

onValue

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




// =============================
// Firebase配置
// =============================


const firebaseConfig = {


apiKey:
"AIzaSyAol_a1CtPS-j8q7ugcDNBm13YeIuQd8ps",


authDomain:
"tgema-9e482.firebaseapp.com",


projectId:
"tgema-9e482",


storageBucket:
"tgema-9e482.firebasestorage.app",


messagingSenderId:
"160811004171",


appId:
"1:160811004171:web:c36ceca017bf59e2d1b20e",


measurementId:
"G-NWVCZRK6VF"

};



// 初始化

const app =
initializeApp(firebaseConfig);



const db =
getDatabase(app);




// =============================
// 游戏变量
// =============================


let roomID="";

let playerID="";

let myName="";

let locked=false;


//题目数量

const maxQuestion=20;

// =============================
// 创建房间
// =============================


async function createRoom(){


let input =
document
.getElementById("roomInput")
.value
.trim();



if(input.length<3){

alert("请输入至少3位房间号");

return;

}



roomID=input;


let old =
await get(
ref(db,"rooms/"+roomID)
);


if(old.exists()){


alert("房间已经存在");

return;


}



playerID="player1";

myName="玩家1";



await set(

ref(db,"rooms/"+roomID),

{


player1:{

score:0

},


player2:null,


turn:1,


questionIndex:0,


question:null,


finished:false


}

);



enterGame();

listenRoom();




}







// =============================
// 加入房间
// =============================


async function joinRoom(){



let code =
document
.getElementById("roomInput")
.value
.trim();



if(!code){

alert("请输入房间号");

return;

}



roomID=code;



let snap =
await get(
ref(db,"rooms/"+roomID)
);



if(!snap.exists()){


alert("没有找到这个房间");


return;


}



let data=snap.val();



if(data.player2){


alert("房间已经满了");


return;


}



playerID="player2";

myName="玩家2";



await update(

ref(db,"rooms/"+roomID),

{

player2:{

score:0

}

}

);



enterGame();

listenRoom();



}






// =============================
// 进入游戏界面
// =============================


function enterGame(){



document
.getElementById("login")
.classList
.add("hidden");



document
.getElementById("game")
.classList
.remove("hidden");



document
.getElementById("player")
.innerHTML=
"身份："+myName;



document
.getElementById("roomShow")
.innerHTML=
"房间号："+roomID;


}






// =============================
// 监听房间
// =============================


function listenRoom(){



onValue(

ref(
db,
"rooms/"+roomID
),


(snapshot)=>{


let data =
snapshot.val();



if(!data)return;



document
.getElementById("score1")
.innerHTML =
data.player1?.score || 0;



document
.getElementById("score2")
.innerHTML =
data.player2?.score || 0;



showQuestion(data);



}


);



}

// =============================
// 诗词题库
// =============================


const poems=[


{
q:"床前明月光，下一句是？",

a:[
"疑是地上霜",
"举头望明月",
"低头思故乡",
"明月几时有"
],

correct:"疑是地上霜"

},


{
q:"白日依山尽，下一句是？",

a:[
"黄河入海流",
"欲穷千里目",
"更上一层楼",
"孤帆远影碧空尽"
],

correct:"黄河入海流"

},


{
q:"海内存知己，下一句是？",

a:[
"天涯若比邻",
"相逢何必曾相识",
"君自故乡来",
"明月照大江"
],

correct:"天涯若比邻"

},


{
q:"春眠不觉晓，下一句是？",

a:[
"处处闻啼鸟",
"夜来风雨声",
"花落知多少",
"月落乌啼霜满天"
],

correct:"处处闻啼鸟"

},


{
q:"举头望明月，下一句是？",

a:[
"低头思故乡",
"疑是地上霜",
"明月几时有",
"月是故乡明"
],

correct:"低头思故乡"

}


];





// =============================
// 创建一道题
// =============================


function createQuestion(index){


let p =
poems[
index % poems.length
];



//复制选项

let options =
[...p.a];



//随机打乱

for(
let i=options.length-1;
i>0;
i--
){

let j =
Math.floor(
Math.random()*(i+1)
);


[
options[i],
options[j]
]=
[
options[j],
options[i]
];


}




return {


q:p.q,


a:options,


correct:p.correct


};


}





// =============================
// 显示题目
// =============================


function showQuestion(data){


if(!data.player2){

document
.getElementById("status")
.innerHTML=
"等待玩家2加入...";


return;

}



if(data.finished){

return;

}



//第一次创建题目

if(!data.question){



if(playerID=="player1"){


let q =
createQuestion(
data.questionIndex
);



update(

ref(
db,
"rooms/"+roomID
),

{

question:q

}

);


}


return;

}





let q =
data.question;



document
.getElementById("question")
.innerHTML =
q.q;



let myTurn =

(
data.turn==1
&&
playerID=="player1"
)

||

(
data.turn==2
&&
playerID=="player2"
);



document
.getElementById("status")
.innerHTML =

myTurn

?

"轮到你答题"

:

"等待对方答题";




let box =
document
.getElementById("options");


box.innerHTML="";



q.a.forEach(item=>{


let btn =
document.createElement("button");



btn.className="option";



btn.innerHTML=item;



if(myTurn){


btn.onclick=()=>{


answer(
item,
data
);


};


}

else{


btn.disabled=true;


}



box.appendChild(btn);



});



}

// =============================
// 回答问题
// =============================


async function answer(choice,data){


if(locked){

return;

}


locked=true;



let correct =
data.question.correct;



let right =
choice===correct;



let score1 =
data.player1?.score || 0;


let score2 =
data.player2?.score || 0;



// 玩家1答题

if(playerID=="player1"){



if(right){

score1+=10;

}



await update(

ref(
db,
"rooms/"+roomID
),

{


"player1/score":score1,


turn:2


}

);



}



// 玩家2答题

else{



if(right){

score2+=10;

}



let next =
Number(
data.questionIndex
)+1;



if(next>=maxQuestion){



await update(

ref(
db,
"rooms/"+roomID
),

{


"player2/score":score2,


finished:true,


turn:0


}


);



}else{



let newQuestion =
createQuestion(next);



await update(

ref(
db,
"rooms/"+roomID
),

{


"player2/score":score2,


questionIndex:next,


question:newQuestion,


turn:1


}


);



}



}



setTimeout(()=>{


locked=false;


},500);



}





// =============================
// 游戏结束显示
// =============================


function showResult(data){



let s1 =
data.player1?.score || 0;


let s2 =
data.player2?.score || 0;



document
.getElementById("question")
.innerHTML=
"🎉 游戏结束";



document
.getElementById("options")
.innerHTML=
"";


let text="";


if(s1>s2){

text="🏆 玩家1胜利";

}

else if(s2>s1){

text="🏆 玩家2胜利";

}

else{

text="🤝 平局";

}



document
.getElementById("status")
.innerHTML=

text+

"<br>玩家1："+s1+
"分<br>玩家2："+s2+
"分";



}





// =============================
// 绑定按钮
// =============================

alert("代码加载成功");

window.createRoom =
createRoom;


window.joinRoom =
joinRoom;



</script>


</body>


</html>
