// ========================================

let roomID = "";

// ========================================
// 页面工具
// ========================================

function $(id){

    return document.getElementById(id);

}


function showGame(){

    $("login")
    .classList.add("hidden");

    $("game")
    .classList.remove("hidden");

}


function showLogin(){

    $("game")
    .classList.add("hidden");

    $("login")
    .classList.remove("hidden");

}


function setStatus(text){

    $("status").innerHTML = text;

}


// ========================================
// 进入房间
// ========================================

function enterRoom(){

    showGame();

    $("roomShow").innerHTML =
        "房间号：<b>" + roomID + "</b>";

    $("player").innerHTML =
        "身份：" + myName;

    $("score1").innerHTML = "0";

    $("score2").innerHTML = "0";

    $("question").innerHTML = "";

    $("options").innerHTML = "";

    $("result").classList.add("hidden");

    answering = false;

}


// ========================================
// 随机房间号
// ========================================

function randomRoom(){

    return String(
        Math.floor(
            100000 +
            Math.random() * 900000
        )
    );

}
// ========================================
// 创建房间
// ========================================

async function createRoom(){

    if(roomID){

        return;

    }


    let input =
        $("roomInput").value.trim();


    // 自定义房间号

    if(input !== ""){

        if(!/^\d{4,8}$/.test(input)){

            alert("房间号必须是4~8位数字");

            return;

        }

        roomID = input;

    }else{

        roomID = randomRoom();

    }


    roomRef =
        ref(db,"rooms/"+roomID);


    // 检查房间是否已经存在

    try{

        const old =
            await get(roomRef);


        if(old.exists()){

            alert(
                "房间 "+roomID+
                " 已存在，请换一个房间号"
            );

            roomID = "";

            return;

        }


    }catch(err){

        console.error(err);

        alert(
            "连接服务器失败，请检查网络"
        );

        roomID = "";

        return;

    }


    playerID = "player1";

    myName = "玩家1";


    // 先进入界面，不等待Firebase

    enterRoom();

    setStatus(
        "正在创建房间，请稍候..."
    );


    // 生成本局20题

    const questions =
        createGameQuestions();


    const roomData = {

        player1:{
            score:0,
            online:true
        },

        player2:null,

        turn:1,

        index:0,

        total:20,

        started:false,

        finished:false,

        createdAt:Date.now(),

        questions:questions

    };


    try{

    // 先创建房间
    await set(
        roomRef,
        roomData
    );


    // 房间创建成功后立即进入等待状态
    setStatus(
        "房间创建成功，等待玩家2加入..."
    );


    listenRoom();


    // 最后设置断线自动删除
    onDisconnect(roomRef)
        .remove()
        .catch(err => {

            console.error(
                "断线清理设置失败：",
                err
            );

        });


}catch(err){

        console.error(err);

        alert(
            "创建房间失败："+err.message
        );

        roomID = "";

        playerID = "";

        showLogin();

    }

}


// ========================================
// 加入房间
// ========================================

async function joinRoom(){

    if(roomID){

        return;

    }


    let input =
        $("roomInput").value.trim();


    if(!/^\d{4,8}$/.test(input)){

        alert("请输入4~8位数字房间号");

        return;

    }


    roomID = input;

    roomRef =
        ref(db,"rooms/"+roomID);


    playerID = "player2";

    myName = "玩家2";


    setStatus("正在查找房间...");


    try{

        const snapshot =
            await get(roomRef);


        if(!snapshot.exists()){

            alert("房间不存在");

            roomID = "";

            playerID = "";

            return;

        }


        const data =
            snapshot.val();


        if(data.finished){

            alert("这个房间的比赛已经结束");

            roomID = "";

            playerID = "";

            return;

        }


        if(data.player2){

            alert("房间已经满了");

            roomID = "";

            playerID = "";

            return;

        } 
        // 玩家2断线只删除自己

        await onDisconnect(
            ref(
                db,
                "rooms/"+roomID+"/player2"
            )
        ).remove();


        // 加入房间

        await update(
            roomRef,
            {

                player2:{
                    score:0,
                    online:true
                },

                started:true,

                turn:1,

                index:0,

                finished:false

            }
        );


        enterRoom();

        setStatus(
            "玩家2已加入，比赛开始！"
        );


        listenRoom();


    }catch(err){

        console.error(err);

        alert(
            "加入房间失败："+err.message
        );

        roomID = "";

        playerID = "";

        showLogin();

    }

}


// ========================================
// 监听房间
// ========================================

function listenRoom(){

    if(stopListen){

        stopListen();

    }


    stopListen =
        onValue(
            roomRef,
            snapshot => {

                const data =
                    snapshot.val();


                // 房间被删除

                if(!data){

                    setStatus(
                        "房间已经关闭"
                    );

                    alert(
                        "房间已关闭"
                    );

                    if(stopListen){

                        stopListen();

                        stopListen = null;

                    }

                    roomID = "";

                    playerID = "";

                    showLogin();

                    return;

                }


                // 更新分数

                $("score1").innerHTML =
                    data.player1?.score || 0;


                $("score2").innerHTML =
                    data.player2?.score || 0;


                // 房间等待状态

                if(!data.player2){

                    setStatus(
                        "⏳ 等待玩家2加入..."
                    );

                    $("question").innerHTML =
                        "等待另一名玩家";

                    $("options").innerHTML =
                        "";

                    $("result")
                        .classList.add("hidden");

                    return;

                }


                // 已结束

                if(data.finished){

                    showResult(data);

                    return;

                }


                // 正常游戏

                showQuestion(data);

            }
        );

}


// ========================================
// 显示题目
// ========================================

function showQuestion(data){

    // 比赛状态

    updateStatus(data);


    const index =
        Number(data.index || 0);


    const questions =
        data.questions || [];


    const q =
        questions[index];


    if(!q){

        return;

    }


    $("question").innerHTML =
        "第 "+(index+1)+"/20 题<br><br>"+
        q.q;


    const box =
        $("options");


    box.innerHTML = "";


    const myTurn =
        (
            data.turn === 1 &&
            playerID === "player1"
        )
        ||
        (
            data.turn === 2 &&
            playerID === "player2"
        );


    let options =
        [...q.a];


    // 随机答案顺序

    options.sort(
        () => Math.random()-0.5
    );


    options.forEach(choice => {

        const btn =
            document.createElement("button");


        btn.className =
            "option";


        btn.innerHTML =
            choice;


        if(myTurn){

            btn.onclick =
                () => answer(choice);

        }else{

            btn.disabled = true;

        }


        box.appendChild(btn);

    });

}
// ========================================
// 状态显示
// ========================================

function updateStatus(data){

    if(!data.player2){

        setStatus(
            "⏳ 等待玩家2加入..."
        );

        return;

    }


    const myTurn =
        (
            data.turn === 1 &&
            playerID === "player1"
        )
        ||
        (
            data.turn === 2 &&
            playerID === "player2"
        );


    if(myTurn){

        setStatus(
            "🎯 轮到你答题"
        );

    }else{

        setStatus(
            "⏳ 等待对方答题..."
        );

    }

}


// ========================================
// 回答问题
// ========================================

async function answer(choice){

    if(answering){

        return;

    }


    answering = true;


    try{

        // 重新读取服务器数据

        const snapshot =
            await get(roomRef);


        if(!snapshot.exists()){

            answering = false;

            return;

        }


        const data =
            snapshot.val();


        // 比赛已经结束

        if(data.finished){

            answering = false;

            return;

        }


        // 防止不是自己的回合

        const myTurn =
            (
                data.turn === 1 &&
                playerID === "player1"
            )
            ||
            (
                data.turn === 2 &&
                playerID === "player2"
            );


        if(!myTurn){

            answering = false;

            return;

        }


        const index =
            Number(data.index || 0);


        const q =
            data.questions[index];


        if(!q){

            answering = false;

            return;

        }


        const win =
            choice === q.c;


        let score1 =
            Number(
                data.player1?.score || 0
            );


        let score2 =
            Number(
                data.player2?.score || 0
            );


        if(playerID === "player1"){

            if(win){

                score1 += 10;

            }

        }else{

            if(win){

                score2 += 10;

            }

        }


        // 最后一题

        if(index >= 19){

            await update(
                roomRef,
                {

                    "player1/score":
                        score1,

                    "player2/score":
                        score2,

                    finished:true,

                    index:20

                }
            );


            answering = false;

            return;

        }


        // 下一题

        await update(
            roomRef,
            {

                "player1/score":
                    score1,

                "player2/score":
                    score2,

                index:index+1,

                turn:
                    data.turn === 1
                    ? 2
                    : 1

            }
        );


    }catch(err){

        console.error(err);

        alert(
            "答题失败，请重试"
        );

    }


    answering = false;

}


// ========================================
// 显示最终结果
// ========================================

function showResult(data){

    $("question").innerHTML =
        "🎉 本局比赛结束";


    $("options").innerHTML =
        "";


    const s1 =
        Number(
            data.player1?.score || 0
        );


    const s2 =
        Number(
            data.player2?.score || 0
        );


    let resultText = "";


    if(s1 > s2){

        resultText =
            "🏆 玩家1获胜！";

    }else if(s2 > s1){

        resultText =
            "🏆 玩家2获胜！";

    }else{

        resultText =
            "🤝 平局！";

    }


    $("finalScore").innerHTML =

        "<div class='resultScore'>"+
        resultText+
        "</div><br>"+
        "玩家1："+s1+" 分<br>"+
        "玩家2："+s2+" 分";


    $("result")
        .classList
        .remove("hidden");


    $("leaveBtn")
        .classList
        .add("hidden");


    setStatus(
        "比赛已经结束"
    );

}
// ========================================
// 再来一局
// ========================================

async function restart(){

    if(!roomID){

        return;

    }


    try{

        const snapshot =
            await get(roomRef);


        if(!snapshot.exists()){

            alert("房间不存在");

            return;

        }


        const data =
            snapshot.val();


        if(!data.player2){

            alert(
                "需要两名玩家才能开始"
            );

            return;

        }


        // 只有玩家1负责生成新题目

        if(playerID !== "player1"){

            setStatus(
                "正在等待玩家1开始新一局..."
            );

            return;

        }


        const questions =
            createGameQuestions();


        await update(
            roomRef,
            {

                "player1/score":0,

                "player2/score":0,

                turn:1,

                index:0,

                total:20,

                finished:false,

                started:true,

                questions:questions

            }
        );


        $("result")
            .classList
            .add("hidden");


        $("leaveBtn")
            .classList
            .remove("hidden");


        setStatus(
            "🔄 新的一局开始！"
        );


    }catch(err){

        console.error(err);

        alert(
            "重新开始失败"
        );

    }

}


// ========================================
// 离开房间
// ========================================

async function leaveRoom(){

    if(!roomID){

        showLogin();

        return;

    }


    const oldRoom =
        roomRef;


    const oldPlayer =
        playerID;


    // 先解除监听

    if(stopListen){

        stopListen();

        stopListen = null;

    }


    try{

        // 玩家1退出：

        // 整个房间直接删除

        if(oldPlayer === "player1"){

            await remove(oldRoom);

        }else{

            // 玩家2退出：

            // 删除玩家2

            await remove(
                ref(
                    db,
                    "rooms/"+
                    roomID+
                    "/player2"
                )
            );


            // 房间仍由玩家1保留

            await update(
                oldRoom,
                {
                    started:false
                }
            );

        }

    }catch(err){

        console.error(err);

    }


    roomID = "";

    playerID = "";

    myName = "";

    roomRef = null;

    answering = false;


    $("roomInput").value = "";


    $("result")
        .classList
        .add("hidden");


    $("leaveBtn")
        .classList
        .remove("hidden");


    showLogin();

}

// 生成20道随机题
// ========================================

function createGameQuestions(){

    const pool =
        [...poems];

    const list = [];


    while(
        list.length < 20 &&
        pool.length > 0
    ){

        const index =
            Math.floor(
                Math.random() *
                pool.length
            );


        list.push(
            pool[index]
        );


        pool.splice(index,1);

    }


    return list;

}
